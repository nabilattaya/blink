name: Sync upstream and publish Docker Hub

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 6 * * *'
      timezone: "America/Detroit"
  workflow_dispatch:

concurrency:
  group: blink-main-sync-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  IMAGE_NAME: nabilattaya/blink

jobs:
  sync-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Blink
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge upstream Glance when scheduled or requested
        id: sync
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/glanceapp/glance.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "Blink already contains upstream/main."
            exit 0
          fi

          set +e
          git merge --no-edit upstream/main
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            git merge --abort || true
            echo "::error::Upstream Glance does not merge cleanly into Blink main. No changes were pushed."
            exit "$status"
          fi

          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: state
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPDATED: ${{ steps.sync.outputs.updated }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$UPDATED" = "true" ]; then
            should_publish=true
          else
            should_publish=false
          fi

          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"

          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.state.outputs.should_publish == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Go tests
        if: steps.state.outputs.should_publish == 'true'
        run: go test ./...

      - name: Run race tests
        if: steps.state.outputs.should_publish == 'true'
        run: go test -race ./...

      - name: Run go vet
        if: steps.state.outputs.should_publish == 'true'
        run: go vet ./...

      - name: Build Go packages
        if: steps.state.outputs.should_publish == 'true'
        run: go build ./...

      - name: Set up Node
        if: steps.state.outputs.should_publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install browser test dependencies
        if: steps.state.outputs.should_publish == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.state.outputs.should_publish == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run browser refresh suite
        if: steps.state.outputs.should_publish == 'true'
        run: npm run test:browser

      - name: Push clean upstream merge to main
        if: steps.sync.outputs.updated == 'true'
        run: git push origin HEAD:main

      - name: Set up QEMU
        if: steps.state.outputs.should_publish == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.state.outputs.should_publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.state.outputs.should_publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: steps.state.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ steps.state.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.state.outputs.sha }}
            org.opencontainers.image.title=Blink
            org.opencontainers.image.description=Blink fork of Glance
          cache-from: type=gha
          cache-to: type=gha,mode=max
